<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bike Airtime Calculator 🚀</title>
    <style>
        body { 
            background: #0f1115; 
            color: #ffffff; 
            font-family: system-ui, -apple-system, sans-serif; 
            text-align: center; 
            padding: 10px; 
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { font-size: 1.5rem; margin: 10px 0; color: #00ffcc; }

        .nav-bar {
            width: 90%;
            max-width: 380px;
            display: flex;
            justify-content: flex-end;
            margin-bottom: 5px;
        }

        .nav-link-btn {
            background: #181c24;
            color: #00ffcc;
            border: 1px solid #282f3d;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
        }

        .card {
            background: #181c24;
            border: 1px solid #282f3d;
            border-radius: 12px;
            padding: 12px;
            margin: 8px 0;
            width: 90%;
            max-width: 380px;
            box-sizing: border-box;
            text-align: right;
        }

        label { font-size: 0.85rem; color: #aaa; display: block; margin-bottom: 4px; }
        
        input[type="file"] {
            width: 100%;
            padding: 8px;
            background: #111419;
            border: 1px dashed #3a4454;
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            box-sizing: border-box;
            font-size: 0.9rem;
        }

        video {
            width: 90%;
            max-width: 380px;
            border-radius: 12px;
            background: #000;
            margin-top: 5px;
            border: 2px solid #282f3d;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 8px;
        }

        button.control-btn {
            background: #252b3b;
            color: #00ffcc;
            border: 1px solid #3a4454;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
        }

        button.control-btn:active { background: #00ffcc; color: #0f1115; }

        button.mark-btn {
            background: linear-gradient(135deg, #00ffcc, #00b386);
            color: #0f1115;
            font-size: 1rem;
            font-weight: bold;
            padding: 14px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 6px;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.2);
        }

        .results-box {
            background: #181c24;
            border: 1px solid #00ffcc;
            border-radius: 12px;
            padding: 12px;
            margin: 10px 0;
            width: 90%;
            max-width: 380px;
            box-sizing: border-box;
            text-align: center;
        }

        .results-box h2 {
            margin: 0 0 5px 0;
            font-size: 2rem;
            color: #00ffcc;
        }

        .results-box p {
            margin: 4px 0;
            font-size: 0.95rem;
            color: #ddd;
        }

        .step-info {
            font-size: 0.85rem;
            color: #ffaa00;
            margin-top: 4px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="nav-bar">
        <a href="index.html" class="nav-link-btn">🚲 מעבר לטיימר מסלול</a>
    </div>

    <h1>Bike Airtime Calculator 🚀</h1>

    <div class="card">
        <label>בחר סרטון קפיצה מהגלריה:</label>
        <input type="file" id="videoUpload" accept="video/*">
    </div>

    <video id="jumpVideo" controls playsinline></video>

    <div class="card" id="actionsCard" style="display:none;">
        <div class="controls-grid">
            <button class="control-btn" onclick="stepFrame(-1)">◀ פריים אחורה</button>
            <button class="control-btn" onclick="stepFrame(1)">פריים קדימה ▶</button>
        </div>
        
        <button class="mark-btn" id="markBtn" onclick="handleMark()">סמן רגע ניתוק מהקרקע (Takeoff)</button>
        <div class="step-info" id="stepInfo">עצור בדיוק בפריים שבו הגלגלים עוזבים את האדמה</div>
    </div>

    <div class="results-box" id="resultsBox" style="display:none;">
        <p>זמן אוויר נמדד (Airtime):</p>
        <h2 id="airtimeDisplay">0.000 שניות</h2>
        <p id="distanceDisplay">מרחק משוער באוויר: -- מטר</p>
        <button class="control-btn" onclick="resetMeasurement()" style="margin-top: 8px; width:100%;">מדוד מחדש</button>
    </div>

    <script>
        const videoInput = document.getElementById('videoUpload');
        const video = document.getElementById('jumpVideo');
        const actionsCard = document.getElementById('actionsCard');
        const markBtn = document.getElementById('markBtn');
        const stepInfo = document.getElementById('stepInfo');
        const resultsBox = document.getElementById('resultsBox');
        const airtimeDisplay = document.getElementById('airtimeDisplay');
        const distanceDisplay = document.getElementById('distanceDisplay');

        let takeoffTime = null;
        let landingTime = null;

        videoInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const fileURL = URL.createObjectURL(file);
                video.src = fileURL;
                video.load();
                actionsCard.style.display = 'block';
                resultsBox.style.display = 'none';
                takeoffTime = null;
                landingTime = null;
                markBtn.innerText = "סמן רגע ניתוק מהקרקע (Takeoff)";
                stepInfo.innerText = "עצור בדיוק בפריים שבו הגלגלים עוזבים את האדמה";
            }
        });

        function stepFrame(direction) {
            const fpsStep = 0.033;
            video.currentTime = Math.max(0, Math.min(video.duration, video.currentTime + (direction * fpsStep)));
            video.pause();
        }

        function handleMark() {
            if (takeoffTime === null) {
                takeoffTime = video.currentTime;
                markBtn.innerText = "סמן רגע נחיתה (Landing)";
                stepInfo.innerText = "העבר את הסרטון לפריים שבו הגלגלים נוחתים בחזרה ולחץ";
                video.currentTime += 0.5;
            } else if (landingTime === null) {
                landingTime = video.currentTime;
                
                if (landingTime <= takeoffTime) {
                    alert("זמן הנחיתה חייב להיות אחרי זמן הניתוק!");
                    landingTime = null;
                    return;
                }

                calculateAirtime();
            }
        }

        function calculateAirtime() {
            let airtime = landingTime - takeoffTime;
            
            // נוסחה מעודכנת ומדויקת לקפיצות גדולות ומהירות בשטח
            let estimatedDistance = airtime * 12.5;

            airtimeDisplay.innerText = airtime.toFixed(3) + " שניות";
            distanceDisplay.innerText = "מרחק משוער באוויר: כ-" + estimatedDistance.toFixed(1) + " מטר";

            actionsCard.style.display = 'none';
            resultsBox.style.display = 'block';
        }

        function resetMeasurement() {
            takeoffTime = null;
            landingTime = null;
            markBtn.innerText = "סמן רגע ניתוק מהקרקע (Takeoff)";
            stepInfo.innerText = "עצור בדיוק בפריים שבו הגלגלים עוזבים את האדמה";
            actionsCard.style.display = 'block';
            resultsBox.style.display = 'none';
            video.currentTime = 0;
        }
    </script>
</body>
</html>
