<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bike Timer Pro - Auto Start/Stop by Motion</title>
    <style>
        body { 
            background: #0f1115; 
            color: #ffffff; 
            font-family: system-ui, -apple-system, sans-serif; 
            text-align: center; 
            padding: 10px; 
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { font-size: 1.5rem; margin: 10px 0; color: #00ffcc; }

        .card {
            background: #181c24;
            border: 1px solid #282f3d;
            border-radius: 12px;
            padding: 12px;
            margin: 8px 0;
            width: 90%;
            max-width: 380px;
            box-sizing: border-box;
        }

        input[type="text"], select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 8px;
            border: 1px solid #3a4454;
            background: #111419;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
        }

        .range-group {
            text-align: right;
            font-size: 0.85rem;
            margin-bottom: 8px;
        }

        .range-group input { width: 100%; accent-color: #00ffcc; }

        .big-btn-container {
            display: flex;
            gap: 10px;
            width: 90%;
            max-width: 380px;
            margin: 10px 0;
        }

        button.action-btn {
            flex: 2;
            background: linear-gradient(135deg, #00ffcc, #00b386);
            color: #0f1115;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 16px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.3);
        }

        button.reset-btn {
            flex: 1;
            background: #ff4444;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 16px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 68, 68, 0.3);
        }

        button:active { transform: scale(0.97); }

        #timer { font-size: 3rem; font-weight: bold; color: #00ffcc; margin: 5px 0; }
        #status { font-size: 1rem; color: #ffaa00; margin-bottom: 5px; }

        #leaderboard { 
            background: #181c24; 
            border: 1px solid #282f3d; 
            padding: 10px; 
            border-radius: 12px; 
            width: 90%; 
            max-width: 380px; 
            box-sizing: border-box;
        }

        #leaderboard h3 { margin: 0 0 8px 0; font-size: 1rem; }
        
        #resultsList { 
            list-style: none; 
            padding: 0; 
            margin: 0 0 10px 0; 
            max-height: 110px; 
            overflow-y: auto; 
            text-align: right;
            font-size: 0.9rem;
        }

        #resultsList li { padding: 4px 0; border-bottom: 1px solid #222834; }

        .clear-btn { background: #333d4f; color: #ccc; font-size: 0.8rem; padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; }

        video { display: none; }
        canvas { width: 90%; max-width: 380px; border: 3px solid #00ffcc; border-radius: 12px; background: #000; margin-top: 5px; }
    </style>
</head>
<body>

    <h1>Bike Timer Pro 🚲</h1>
    
    <div class="card">
        <input type="text" id="sessionName" placeholder="שם הסשן (למשל: ירידה צפונית)">
    </div>

    <div class="card">
        <div class="range-group">
            <label>חיתוך צדדים (רוחב):</label>
            <input type="range" id="cropX" min="5" max="45" value="25" oninput="if(!isRunning && !isFinished) drawPreview()">
        </div>
        <div class="range-group">
            <label>חיתוך מעלה/מטה (גובה):</label>
            <input type="range" id="cropY" min="5" max="45" value="25" oninput="if(!isRunning && !isFinished) drawPreview()">
        </div>
    </div>

    <div class="card">
        <div style="display: flex; gap: 10px;">
            <div style="flex: 1; text-align: right;">
                <label style="font-size: 0.8rem;">כמות רוכבים:</label>
                <select id="ridersCount">
                    <option value="1" selected>רוכב 1</option>
                    <option value="2">2 רוכבים</option>
                    <option value="3">3 רוכבים</option>
                    <option value="4">4 רוכבים</option>
                    <option value="5">5 רוכבים</option>
                </select>
            </div>
            <div style="flex: 1; text-align: right;">
                <label style="font-size: 0.8rem;">השהייה ראשונית:</label>
                <select id="delaySelect">
                    <option value="auto_motion" selected>אוטומטי (תנועה מתחילה ועוצרת)</option>
                    <option value="5">5 שניות</option>
                    <option value="10">10 שניות</option>
                    <option value="15">15 שניות</option>
                    <option value="20">20 שניות</option>
                    <option value="30">30 שניות</option>
                    <option value="60">דקה אחת (60 ש')</option>
                    <option value="120">2 דקות (120 ש')</option>
                    <option value="180">3 דקות (180 ש')</option>
                </select>
            </div>
        </div>
        <div style="margin-top: 8px; text-align: right;">
            <label style="font-size: 0.8rem;">השהייה בין רוכבים:</label>
            <select id="gapSelect">
                <option value="3">3 שניות</option>
                <option value="5" selected>5 שניות</option>
                <option value="10">10 שניות</option>
                <option value="15">15 שניות</option>
            </select>
        </div>
    </div>

    <div class="big-btn-container">
        <button class="action-btn" onclick="startSession()">התחל סשן</button>
        <button class="reset-btn" onclick="resetTimer()">איפוס</button>
    </div>

    <div id="status">מוכן להתחלה</div>
    <div id="timer">00.000</div>

    <video id="webcam" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <div id="leaderboard" style="margin-top: 15px;">
        <h3>תוצאות הסשן הנוכחי</h3>
        <ul id="resultsList"></ul>
        <button class="clear-btn" onclick="clearHistory()">מחק היסטוריה</button>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', {willReadFrequently: true});
        const timerDisplay = document.getElementById('timer');
        const statusDisplay = document.getElementById('status');
        const resultsList = document.getElementById('resultsList');
        
        let startTime = 0;
        let isRunning = false;
        let isWaitingForStartMotion = false;
        let isFinished = false;
        let lastFrameData = null;
        let countdownTimer = null;
        let nextRiderTimeout = null;
        let currentRider = 1;
        let totalRiders = 1;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playBeep(freq, duration) {
            try {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        window.addEventListener('DOMContentLoaded', loadHistory);

        video.addEventListener('loadedmetadata', () => {
            canvas.width = video.videoWidth || 300;
            canvas.height = video.videoHeight || 150;
            drawLiveFeed();
        });

        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(stream => { video.srcObject = stream; })
            .catch(err => { statusDisplay.innerText = "שגיאה בגישה למצלמה!"; });

        function drawLiveFeed() {
            if (!video.videoWidth) return;
            if (!isRunning && !isWaitingForStartMotion && !isFinished) {
                drawPreview();
            }
            requestAnimationFrame(drawLiveFeed);
        }

        function drawPreview() {
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            let cropX = parseInt(document.getElementById('cropX').value) / 100;
            let cropY = parseInt(document.getElementById('cropY').value) / 100;

            let sw = canvas.width * (1 - (cropX * 2));
            let sh = canvas.height * (1 - (cropY * 2));
            let sx = canvas.width * cropX;
            let sy = canvas.height * cropY;

            ctx.strokeStyle = "#ff4444";
            ctx.lineWidth = 4;
            ctx.strokeRect(sx, sy, sw, sh);
        }

        function startSession() {
            if (isRunning || isWaitingForStartMotion) return;
            
            let delaySetting = document.getElementById('delaySelect').value;
            totalRiders = parseInt(document.getElementById('ridersCount').value);
            currentRider = 1;
            isFinished = false;
            
            if (countdownTimer) clearInterval(countdownTimer);
            if (nextRiderTimeout) clearTimeout(nextRiderTimeout);

            if (delaySetting === "auto_motion") {
                // מצב תנועה אוטומטי מלא (פעם ראשונה מתחיל, פעם שנייה עוצר)
                statusDisplay.innerText = `ממתין לרוכב ${currentRider} — עבור בפריים כדי להתחיל!`;
                canvas.width = video.videoWidth || 300;
                canvas.height = video.videoHeight || 150;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                lastFrameData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                isWaitingForStartMotion = true;
                runAutoMotionDetection();
            } else {
                // מצב עם השהיית זמן רגילה
                let delay = parseInt(delaySetting);
                statusDisplay.innerText = `הכנה לרוכב 1 - מתחיל בעוד: ${delay} שניות...`;
                
                countdownTimer = setInterval(() => {
                    delay--;
                    if (delay <= 3 && delay > 0) {
                        playBeep(800, 0.25);
                    }

                    if (delay > 0) {
                        statusDisplay.innerText = `הכנה לרוכב 1 - מתחיל בעוד: ${delay} שניות...`;
                    } else {
                        clearInterval(countdownTimer);
                        playBeep(1200, 0.5);
                        beginRunTimer();
                    }
                }, 1000);
            }
        }

        function runAutoMotionDetection() {
            if (!isWaitingForStartMotion && !isRunning) return;

            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            let currentData = ctx.getImageData(0, 0, canvas.width, canvas.height);

            let cropX = parseInt(document.getElementById('cropX').value) / 100;
            let cropY = parseInt(document.getElementById('cropY').value) / 100;

            let startX = Math.floor(canvas.width * cropX);
            let endX = Math.floor(canvas.width * (1 - cropX));
            let startY = Math.floor(canvas.height * cropY);
            let endY = Math.floor(canvas.height * (1 - cropY));

            let diffCount = 0;

            for (let y = startY; y < endY; y += 10) {
                for (let x = startX; x < endX; x += 10) {
                    let i = (y * canvas.width + x) * 4;
                    let rDiff = Math.abs(currentData.data[i] - lastFrameData.data[i]);
                    let gDiff = Math.abs(currentData.data[i+1] - lastFrameData.data[i+1]);
                    let bDiff = Math.abs(currentData.data[i+2] - lastFrameData.data[i+2]);

                    if ((rDiff + gDiff + bDiff) > 80) {
                        diffCount++;
                    }
                }
            }

            if (diffCount > 15) {
                if (isWaitingForStartMotion) {
                    // זיהוי מעבר ראשון -> התחלת הטיימר!
                    isWaitingForStartMotion = false;
                    playBeep(1200, 0.4);
                    startTime = performance.now();
                    isRunning = true;
                    statusDisplay.innerText = `רוכב ${currentRider} בדרך! עבור שוב בסיום לעצירה.`;
                    // משהה קليل כדי לא לתפוס את אותו מעבר מיד כעצירה
                    setTimeout(() => {
                        lastFrameData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                        requestAnimationFrame(runAutoMotionDetection);
                    }, 1000);
                    return;
                } else if (isRunning) {
                    // זיהוי מעבר שני -> עצירת הטיימר!
                    isRunning = false;
                    playBeep(500, 0.5);
                    
                    let sessionName = document.getElementById('sessionName').value || "סשן";
                    let recordName = `${sessionName} (רוכב ${currentRider})`;
                    saveResult(recordName, timerDisplay.innerText);

                    if (currentRider < totalRiders) {
                        currentRider++;
                        let gapSeconds = parseInt(document.getElementById('gapSelect').value);
                        statusDisplay.innerText = `רוכב ${currentRider - 1} סיים! מתחיל רוכב ${currentRider} בעוד ${gapSeconds} שניות...`;
                        
                        let gapCounter = gapSeconds;
                        let gapTimer = setInterval(() => {
                            gapCounter--;
                            if (gapCounter <= 3 && gapCounter > 0) {
                                playBeep(800, 0.25);
                            }
                            if (gapCounter <= 0) {
                                clearInterval(gapTimer);
                                playBeep(1200, 0.4);
                                isWaitingForStartMotion = true;
                                statusDisplay.innerText = `ממתין לרוכב ${currentRider} — עבור בפריים להתחלה!`;
                                lastFrameData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                                runAutoMotionDetection();
                            }
                        }, 1000);
                    } else {
                        isFinished = true;
                        statusDisplay.innerText = "כל הרוכבים סיימו בהצלחה!";
                    }
                    return;
                }
            }

            if (isRunning) {
                const elapsed = (performance.now() - startTime) / 1000;
                timerDisplay.innerText = elapsed.toFixed(3);
            }

            lastFrameData = currentData;
            if (isWaitingForStartMotion || isRunning) {
                requestAnimationFrame(runAutoMotionDetection);
            }
        }

        function beginRunTimer() {
            if (isFinished) return;
            statusDisplay.innerText = `ממתין לרוכב ${currentRider} מתוך ${totalRiders}...`;
            canvas.width = video.videoWidth || 300;
            canvas.height = video.videoHeight || 150;

            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            lastFrameData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            
            startTime = performance.now();
            isRunning = true;
            runDetectionTimer();
        }

        function runDetectionTimer() {
            if (!isRunning) return;

            const elapsed = (performance.now() - startTime) / 1000;
            timerDisplay.innerText = elapsed.toFixed(3);
            
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            let currentData = ctx.getImageData(0, 0, canvas.width, canvas.height);

            let cropX = parseInt(document.getElementById('cropX').value) / 100;
            let cropY = parseInt(document.getElementById('cropY').value) / 100;

            let startX = Math.floor(canvas.width * cropX);
            let endX = Math.floor(canvas.width * (1 - cropX));
            let startY = Math.floor(canvas.height * cropY);
            let endY = Math.floor(canvas.height * (1 - cropY));

            let diffCount = 0;

            for (let y = startY; y < endY; y += 10) {
                for (let x = startX; x < endX; x += 10) {
                    let i = (y * canvas.width + x) * 4;
                    let rDiff = Math.abs(currentData.data[i] - lastFrameData.data[i]);
                    let gDiff = Math.abs(currentData.data[i+1] - lastFrameData.data[i+1]);
                    let bDiff = Math.abs(currentData.data[i+2] - lastFrameData.data[i+2]);

                    if ((rDiff + gDiff + bDiff) > 80) {
                        diffCount++;
                    }
                }
            }

            if (diffCount > 15) {
                isRunning = false;
                playBeep(500, 0.5);
                
                let sessionName = document.getElementById('sessionName').value || "סשן";
                let recordName = `${sessionName} (רוכב ${currentRider})`;
                saveResult(recordName, timerDisplay.innerText);

                if (currentRider < totalRiders) {
                    currentRider++;
                    let gapSeconds = parseInt(document.getElementById('gapSelect').value);
                    statusDisplay.innerText = `רוכב ${currentRider - 1} סיים! מתחיל רוכב ${currentRider} בעוד ${gapSeconds} שניות...`;
                    
                    let gapCounter = gapSeconds;
                    let gapTimer = setInterval(() => {
                        gapCounter--;
                        if (gapCounter <= 3 && gapCounter > 0) {
                            playBeep(800, 0.25);
                        }
                        if (gapCounter <= 0) {
                            clearInterval(gapTimer);
                            playBeep(1200, 0.5);
                            if (!isFinished) beginRunTimer();
                        }
                    }, 1000);
                } else {
                    isFinished = true;
                    statusDisplay.innerText = "כל הרוכבים סיימו בהצלחה!";
                }
                return;
            }

            lastFrameData = currentData;
            requestAnimationFrame(runDetectionTimer);
        }

        function saveResult(session, time) {
            let history = JSON.parse(localStorage.getItem('bikeTimerHistory') || '[]');
            history.unshift({ session, time });
            localStorage.setItem('bikeTimerHistory', JSON.stringify(history));
            renderHistory(history);
        }

        function loadHistory() {
            let history = JSON.parse(localStorage.getItem('bikeTimerHistory') || '[]');
            renderHistory(history);
        }

        function renderHistory(history) {
            resultsList.innerHTML = '';
            history.forEach(item => {
                let li = document.createElement('li');
                li.innerText = `${item.session}: ${item.time} שניות`;
                resultsList.appendChild(li);
            });
        }

        function clearHistory() {
            localStorage.removeItem('bikeTimerHistory');
            resultsList.innerHTML = '';
        }

        function resetTimer() {
            isRunning = false;
            isWaitingForStartMotion = false;
            isFinished = false;
            currentRider = 1;
            if (countdownTimer) clearInterval(countdownTimer);
            if (nextRiderTimeout) clearTimeout(nextRiderTimeout);
            timerDisplay.innerText = "00.000";
            statusDisplay.innerText = "מוכן להתחלה";
            drawPreview();
        }
    </script>
</body>
</html>
