<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bike Timer Pro - Clean UI</title>
    <style>
        body { 
            background: #0f1115; 
            color: #ffffff; 
            font-family: system-ui, -apple-system, sans-serif; 
            text-align: center; 
            padding: 10px; 
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { font-size: 1.5rem; margin: 10px 0; color: #00ffcc; }

        .card {
            background: #181c24;
            border: 1px solid #282f3d;
            border-radius: 12px;
            padding: 12px;
            margin: 8px 0;
            width: 90%;
            max-width: 380px;
            box-sizing: border-box;
        }

        input[type="text"], select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 8px;
            border: 1px solid #3a4454;
            background: #111419;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
        }

        .range-group {
            text-align: right;
            font-size: 0.85rem;
            margin-bottom: 8px;
        }

        .range-group input { width: 100%; accent-color: #00ffcc; }

        .big-btn-container {
            display: flex;
            gap: 10px;
            width: 90%;
            max-width: 380px;
            margin: 10px 0;
        }

        button.action-btn {
            flex: 2;
            background: linear-gradient(135deg, #00ffcc, #00b386);
            color: #0f1115;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 16px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.3);
        }

        button.reset-btn {
            flex: 1;
            background: #ff4444;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 16px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 68, 68, 0.3);
        }

        button:active { transform: scale(0.97); }

        #timer { font-size: 3rem; font-weight: bold; color: #00ffcc; margin: 5px 0; }
        #status { font-size: 1rem; color: #ffaa00; margin-bottom: 5px; }

        #leaderboard { 
            background: #181c24; 
            border: 1px solid #282f3d; 
            padding: 10px; 
            border-radius: 12px; 
            width: 90%; 
            max-width: 380px; 
            box-sizing: border-box;
        }

        #leaderboard h3 { margin: 0 0 8px 0; font-size: 1rem; }
        
        #resultsList { 
            list-style: none; 
            padding: 0; 
            margin: 0 0 10px 0; 
            max-height: 110px; 
            overflow-y: auto; 
            text-align: right;
            font-size: 0.9rem;
        }

        #resultsList li { padding: 4px 0; border-bottom: 1px solid #222834; }

        .clear-btn { background: #333d4f; color: #ccc; font-size: 0.8rem; padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; }

        video { display: none; }
        canvas { width: 90%; max-width: 380px; border: 3px solid #00ffcc; border-radius: 12px; background: #000; margin-top: 5px; }
    </style>
</head>
<body>

    <h1>Bike Timer Pro 🚲</h1>
    
    <div class="card">
        <input type="text" id="sessionName" placeholder="שם הסשן (למשל: ירידה צפונית)">
    </div>

    <div class="card">
        <div class="range-group">
            <label>חיתוך צדדים (רוחב):</label>
            <input type="range" id="cropX" min="5" max="45" value="25" oninput="if(!isRunning && !isFinished) drawPreview()">
        </div>
        <div class="range-group">
            <label>חיתוך מעלה/מטה (גובה):</label>
            <input type="range" id="cropY" min="5" max="45" value="25" oninput="if(!isRunning && !isFinished) drawPreview()">
        </div>
    </div>

    <div class="card">
        <div style="display: flex; gap: 10px;">
            <div style="flex: 1; text-align: right;">
                <label style="font-size: 0.8rem;">כיוון תנועה:</label>
                <select id="directionSelect">
                    <option value="any" selected>כל כיוון</option>
                    <option value="l2r">משמאל לימין ➔</option>
                    <option value="r2l">מימין לשמאל ⬅</option>
                </select>
            </div>
            <div style="flex: 1; text-align: right;">
                <label style="font-size: 0.8rem;">השהייה:</label>
                <select id="delaySelect">
                    <option value="5">5 שניות</option>
                    <option value="10" selected>10 שניות</option>
                    <option value="15">15 שניות</option>
                    <option value="20">20 שניות</option>
                    <option value="30">30 שניות</option>
                </select>
            </div>
        </div>
    </div>

    <div class="big-btn-container">
        <button class="action-btn" onclick="startCountdown()">התחל סשן</button>
        <button class="reset-btn" onclick="resetTimer()">איפוס</button>
    </div>

    <div id="status">מוכן להתחלה</div>
    <div id="timer">00.000</div>

    <video id="webcam" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <div id="leaderboard" style="margin-top: 15px;">
        <h3>תוצאות שמורות</h3>
        <ul id="resultsList"></ul>
        <button class="clear-btn" onclick="clearHistory()">מחק היסטוריה</button>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', {willReadFrequently: true});
        const timerDisplay = document.getElementById('timer');
        const statusDisplay = document.getElementById('status');
        const resultsList = document.getElementById('resultsList');
        
        let startTime = 0;
        let isRunning = false;
        let isArmed = false;
        let isFinished = false;
        let lastFrameData = null;
        let countdownTimer = null;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBeep(freq, duration) {
            try {
                const osc = audioCtx.createOscillator();
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                osc.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        window.addEventListener('DOMContentLoaded', loadHistory);

        video.addEventListener('loadedmetadata', () => {
            canvas.width = video.videoWidth || 300;
            canvas.height = video.videoHeight || 150;
            drawLiveFeed();
        });

        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(stream => { video.srcObject = stream; })
            .catch(err => { statusDisplay.innerText = "שגיאה בגישה למצלמה!"; });

        function drawLiveFeed() {
            if (!video.videoWidth) return;
            if (!isRunning && !isArmed && !isFinished) {
                drawPreview();
            }
            requestAnimationFrame(drawLiveFeed);
        }

        function drawPreview() {
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            let cropX = parseInt(document.getElementById('cropX').value) / 100;
            let cropY = parseInt(document.getElementById('cropY').value) / 100;

            let sw = canvas.width * (1 - (cropX * 2));
            let sh = canvas.height * (1 - (cropY * 2));
            let sx = canvas.width * cropX;
            let sy = canvas.height * cropY;

            ctx.strokeStyle = "#ff4444";
            ctx.lineWidth = 4;
            ctx.strokeRect(sx, sy, sw, sh);
        }

        function startCountdown() {
            if (isRunning || isArmed || isFinished) return;
            
            let delay = parseInt(document.getElementById('delaySelect').value);
            let session = document.getElementById('sessionName').value || "סשן ללא שם";
            
            if (countdownTimer) clearInterval(countdownTimer);

            statusDisplay.innerText = `מתחיל בעוד: ${delay} שניות...`;
            
            countdownTimer = setInterval(() => {
                delay--;
                if (delay > 0) {
                    statusDisplay.innerText = `מתחיל בעוד: ${delay} שניות...`;
                } else {
                    clearInterval(countdownTimer);
                    playBeep(880, 0.2);
                    beginRun(session);
                }
            }, 1000);
        }

        function beginRun(session) {
            statusDisplay.innerText = "ממתין לחצייה במסלול...";
            canvas.width = video.videoWidth || 300;
            canvas.height = video.videoHeight || 150;

            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            lastFrameData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            
            startTime = performance.now();
            isRunning = true;
            isArmed = true;
            runDetection(session);
        }

        function runDetection(session) {
            if (!isRunning) return;

            const elapsed = (performance.now() - startTime) / 1000;
            timerDisplay.innerText = elapsed.toFixed(3);
            
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            let currentData = ctx.getImageData(0, 0, canvas.width, canvas.height);

            let cropX = parseInt(document.getElementById('cropX').value) / 100;
            let cropY = parseInt(document.getElementById('cropY').value) / 100;

            let startX = Math.floor(canvas.width * cropX);
            let endX = Math.floor(canvas.width * (1 - cropX));
            let startY = Math.floor(canvas.height * cropY);
            let endY = Math.floor(canvas.height * (1 - cropY));

            let diffCount = 0;
            let leftSideChanges = 0;
            let rightSideChanges = 0;
            let midX = (startX + endX) / 2;

            for (let y = startY; y < endY; y += 10) {
                for (let x = startX; x < endX; x += 10) {
                    let i = (y * canvas.width + x) * 4;
                    let rDiff = Math.abs(currentData.data[i] - lastFrameData.data[i]);
                    let gDiff = Math.abs(currentData.data[i+1] - lastFrameData.data[i+1]);
                    let bDiff = Math.abs(currentData.data[i+2] - lastFrameData.data[i+2]);

                    if ((rDiff + gDiff + bDiff) > 100) {
                        diffCount++;
                        if (x < midX) leftSideChanges++;
                        else rightSideChanges++;
                    }
                }
            }

            let directionMode = document.getElementById('directionSelect').value;
            let isDirectionValid = true;

            if (diffCount > 15) {
                if (directionMode === "l2r") {
                    // אם נבחר משמאל לימין, עיקר התנועה חייב להתחיל בצד שמאל
                    isDirectionValid = (leftSideChanges > rightSideChanges);
                } else if (directionMode === "r2l") {
                    // אם נבחר מימין לשמאל, עיקר התנועה חייב להתחיל בצד ימין
                    isDirectionValid = (rightSideChanges > leftSideChanges);
                }

                if (isDirectionValid) {
                    isRunning = false;
                    isArmed = false;
                    isFinished = true;
                    playBeep(440, 0.5);
                    statusDisplay.innerText = "הושלם בהצלחה!";
                    saveResult(session, timerDisplay.innerText);
                    return;
                }
            }

            lastFrameData = currentData;
            requestAnimationFrame(() => runDetection(session));
        }

        function saveResult(session, time) {
            let history = JSON.parse(localStorage.getItem('bikeTimerHistory') || '[]');
            history.unshift({ session, time });
            localStorage.setItem('bikeTimerHistory', JSON.stringify(history));
            renderHistory(history);
        }

        function loadHistory() {
            let history = JSON.parse(localStorage.getItem('bikeTimerHistory') || '[]');
            renderHistory(history);
        }

        function renderHistory(history) {
            resultsList.innerHTML = '';
            history.forEach(item => {
                let li = document.createElement('li');
                li.innerText = `${item.session}: ${item.time} שניות`;
                resultsList.appendChild(li);
            });
        }

        function clearHistory() {
            localStorage.removeItem('bikeTimerHistory');
            resultsList.innerHTML = '';
        }

        function resetTimer() {
            isRunning = false;
            isArmed = false;
            isFinished = false;
            if (countdownTimer) clearInterval(countdownTimer);
            timerDisplay.innerText = "00.000";
            statusDisplay.innerText = "מוכן להתחלה";
            drawPreview();
        }
    </script>
</body>
</html>
