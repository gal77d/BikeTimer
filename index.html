<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Bike Timer Pro - Focus Zone</title>
    <style>
        body { background: #121212; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        #timer { font-size: 4rem; color: #00ffcc; }
        .controls { margin: 20px 0; }
        input, select, button { padding: 10px; margin: 5px; border-radius: 8px; border: none; }
        #leaderboard { margin-top: 20px; background: #222; padding: 10px; border-radius: 10px; display: inline-block; width: 80%; }
        video { display: none; }
        canvas { width: 90%; max-width: 400px; border: 3px solid #00ffcc; border-radius: 10px; }
    </style>
</head>
<body>

    <h1>מדידת זמן - אופני הרים</h1>
    <input type="text" id="sessionName" placeholder="שם הסשן (למשל: ירידה צפונית)">
    
    <div class="controls">
        <select id="delaySelect">
            <option value="5">5 שניות</option>
            <option value="10" selected>10 שניות</option>
            <option value="15">15 שניות</option>
            <option value="20">20 שניות</option>
            <option value="30">30 שניות</option>
        </select>
        <button onclick="startCountdown()">התחל סשן</button>
        <button onclick="resetTimer()">איפוס</button>
    </div>

    <div id="status">מוכן להתחלה</div>
    <div id="timer">00.000</div>

    <div id="leaderboard">
        <h3>תוצאות אחרונות</h3>
        <ul id="resultsList" style="list-style: none; padding: 0;"></ul>
    </div>

    <video id="webcam" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <script>
        const video = document.getElementById('webcam'), canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', {willReadFrequently: true});
        const timerDisplay = document.getElementById('timer'), statusDisplay = document.getElementById('status');
        const resultsList = document.getElementById('resultsList');
        
        let startTime, isRunning = false, lastFrameData = null;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBeep(freq, duration) {
            const osc = audioCtx.createOscillator();
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            osc.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }).then(s => video.srcObject = s);

        function startCountdown() {
            let delay = parseInt(document.getElementById('delaySelect'].value);
            let session = document.getElementById('sessionName').value || "סשן ללא שם";
            
            let count = setInterval(() => {
                if (delay > 0) {
                    statusDisplay.innerText = `מתחיל בעוד: ${delay} שניות...`;
                    delay--;
                } else {
                    clearInterval(count);
                    playBeep(880, 0.2);
                    beginRun(session);
                }
            }, 1000);
        }

        function beginRun(session) {
            statusDisplay.innerText = "ממתין לתנועה בקו הסיום...";
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            lastFrameData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            startTime = performance.now();
            isRunning = true;
            runDetection(session);
        }

        function runDetection(session) {
            if (!isRunning) return;
            timerDisplay.innerText = ((performance.now() - startTime) / 1000).toFixed(3);
            
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            let currentData = ctx.getImageData(0, 0, canvas.width, canvas.height);

            // הגדרת אזור ממוקד במרכז המסך בלבד (מתעלם מהצדדים והרקע)
            let startX = Math.floor(canvas.width * 0.3);
            let endX = Math.floor(canvas.width * 0.7);
            let startY = Math.floor(canvas.height * 0.3);
            let endY = Math.floor(canvas.height * 0.7);

            let diffCount = 0;

            for (let y = startY; y < endY; y += 10) {
                for (let x = startX; x < endX; x += 10) {
                    let i = (y * canvas.width + x) * 4;
                    let rDiff = Math.abs(currentData.data[i] - lastFrameData.data[i]);
                    let gDiff = Math.abs(currentData.data[i+1] - lastFrameData.data[i+1]);
                    let bDiff = Math.abs(currentData.data[i+2] - lastFrameData.data[i+2]);

                    // דורש שינוי צבע/אור משמעותי כדי לסנן רעשים קטנים
                    if ((rDiff + gDiff + bDiff) > 120) {
                        diffCount++;
                    }
                }
            }

            // יופעל רק אם יש כמות גדולה של שינויים בתוך אזור המיקוד
            if (diffCount > 15) {
                isRunning = false;
                playBeep(440, 0.5);
                statusDisplay.innerText = "הושלם!";
                saveResult(session, timerDisplay.innerText);
            } else {
                lastFrameData = currentData;
                requestAnimationFrame(() => runDetection(session));
            }
        }

        function saveResult(session, time) {
            let li = document.createElement('li');
            li.innerText = `${session}: ${time} שניות`;
            resultsList.appendChild(li);
        }

        function resetTimer() {
            isRunning = false;
            timerDisplay.innerText = "00.000";
            statusDisplay.innerText = "מוכן להתחלה";
        }
    </script>
</body>
</html>
