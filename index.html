<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Bike Timer Pro - Night Mode</title>
    <style>
        body { background: #121212; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        #timer { font-size: 4rem; color: #00ffcc; }
        .controls { margin: 20px 0; }
        input, select, button { padding: 10px; margin: 5px; border-radius: 8px; border: none; }
        #leaderboard { margin-top: 20px; background: #222; padding: 10px; border-radius: 10px; display: inline-block; width: 80%; }
        video { display: none; }
        canvas { width: 90%; max-width: 400px; border: 3px solid #555; border-radius: 10px; }
    </style>
</head>
<body>

    <h1>מדידת זמן - אופני הרים</h1>
    <input type="text" id="sessionName" placeholder="שם הסשן (למשל: לילה צפונית)">
    
    <div class="controls">
        <select id="delaySelect">
            <option value="5">5 שניות</option>
            <option value="10" selected>10 שניות</option>
            <option value="30">30 שניות</option>
        </select>
        <button onclick="startCountdown()">התחל סשן</button>
        <button onclick="resetTimer()">איפוס</button>
    </div>

    <div id="status">מוכן להתחלה</div>
    <div id="timer">00.000</div>

    <div id="leaderboard">
        <h3>תוצאות אחרונות</h3>
        <ul id="resultsList" style="list-style: none; padding: 0;"></ul>
    </div>

    <video id="webcam" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <script>
        const video = document.getElementById('webcam'), canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', {willReadFrequently: true});
        const timerDisplay = document.getElementById('timer'), statusDisplay = document.getElementById('status');
        const resultsList = document.getElementById('resultsList');
        
        let startTime, isRunning = false, baseBrightness = 0;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBeep(freq, duration) {
            const osc = audioCtx.createOscillator();
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            osc.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }).then(s => video.srcObject = s);

        function startCountdown() {
            let delay = parseInt(document.getElementById('delaySelect').value);
            let session = document.getElementById('sessionName').value || "סשן ללא שם";
            
            let count = setInterval(() => {
                if (delay > 0) {
                    statusDisplay.innerText = `מתחיל בעוד: ${delay} שניות...`;
                    delay--;
                } else {
                    clearInterval(count);
                    playBeep(880, 0.2);
                    beginRun(session);
                }
            }, 1000);
        }

        function beginRun(session) {
            statusDisplay.innerText = "ממתין לחצייה בקו הסיום...";
            
            // דגימת רמת האור ההתחלתית ברגע שהסשן מתחיל
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            let frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
            baseBrightness = getAverageBrightness(frame);

            startTime = performance.now();
            isRunning = true;
            runDetection(session);
        }

        function getAverageBrightness(frameData) {
            let colorSum = 0;
            let pixels = frameData.data.length / 4;
            for (let i = 0; i < frameData.data.length; i += 4) {
                // חישוב בהירות ממוצעת לכל פיקסל (R+G+B)
                colorSum += (frameData.data[i] + frameData.data[i+1] + frameData.data[i+2]) / 3;
            }
            return colorSum / pixels;
        }

        function runDetection(session) {
            if (!isRunning) return;
            timerDisplay.innerText = ((performance.now() - startTime) / 1000).toFixed(3);
            
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            let currentData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let currentBrightness = getAverageBrightness(currentData);

            // אם יש שינוי פתאומי וחד בבהירות (למשל צל של אופניים שעוברים או שינוי אור)
            if (Math.abs(currentBrightness - baseBrightness) > 15) {
                isRunning = false;
                playBeep(440, 0.5);
                statusDisplay.innerText = "הושלם!";
                saveResult(session, timerDisplay.innerText);
            } else {
                requestAnimationFrame(() => runDetection(session));
            }
        }

        function saveResult(session, time) {
            let li = document.createElement('li');
            li.innerText = `${session}: ${time} שניות`;
            resultsList.appendChild(li);
        }

        function resetTimer() {
            isRunning = false;
            timerDisplay.innerText = "00.000";
            statusDisplay.innerText = "מוכן להתחלה";
        }
    </script>
</body>
</html>
