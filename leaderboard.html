<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>לוח תוצאות - BikeTimer</title>
    <style>
        :root {
            --bg-main: #0b0d10;
            --bg-card: #15181f;
            --accent: #00ffcc;
            --text-main: #ffffff;
            --text-muted: #8b95a5;
            --danger: #ff4d4d;
        }

        body { 
            background: var(--bg-main); 
            color: var(--text-main); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            text-align: center; 
            padding: 0; 
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-header {
            width: 100%;
            background: rgba(21, 24, 31, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            box-sizing: border-box;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .app-header h1 { font-size: 1.2rem; margin: 0; color: var(--accent); font-weight: 800; }
        
        .back-btn {
            background: #232833;
            color: var(--text-main);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 15px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            text-align: right;
            margin-bottom: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 5px;
        }

        th, td {
            padding: 10px 8px;
            font-size: 0.9rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            text-align: right;
        }

        th { color: var(--accent); font-weight: 700; }
        td:nth-child(3), th:nth-child(3) { text-align: left; font-variant-numeric: tabular-nums; }

        .clear-btn {
            background: #232833;
            color: var(--danger);
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        .empty-msg {
            color: var(--text-muted);
            padding: 20px;
            font-size: 0.95rem;
            text-align: center;
        }

        .session-title {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--accent);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            border-bottom: 2px solid rgba(0, 255, 204, 0.2);
            padding-bottom: 5px;
        }
    </style>
</head>
<body>

    <header class="app-header">
        <h1>לוח תוצאות</h1>
        <a href="index.html" class="back-btn">⬅ חזרה לטיימר</a>
    </header>
    
    <div class="container">
        <div id="sessionsContainer">
            <div class="empty-msg">טוען תוצאות...</div>
        </div>
        <button class="clear-btn" onclick="clearLeaderboard()">🗑️ איפוס כל לוחות התוצאות</button>
    </div>

    <script>
        function loadLeaderboard() {
            let history = JSON.parse(localStorage.getItem('bikeTimerLeaderboard') || '[]');
            const container = document.getElementById('sessionsContainer');

            if (history.length === 0) {
                container.innerHTML = '<div class="card"><div class="empty-msg">אין עדיין תוצאות שמורות. צא לרכב ותקבע זמן!</div></div>';
                return;
            }

            // קיבוץ התוצאות לפי שם הסשן
            let grouped = {};
            history.forEach(item => {
                let sessionName = item.session && item.session.trim() !== "" ? item.session : "אימון כללי";
                if (!grouped[sessionName]) {
                    grouped[sessionName] = [];
                }
                grouped[sessionName].push(item);
            });

            let html = '';

            // מעבר על כל סשן ויצירת טבלה נפרדת עבורו
            for (let sessionName in grouped) {
                // מיון התוצאות בסשן מהמהיר לאיטי
                grouped[sessionName].sort((a, b) => a.time - b.time);

                html += `<div class="card">
                    <div class="session-title">🌲 ${sessionName}</div>
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>שם הרוכב</th>
                                <th>זמן</th>
                            </tr>
                        </thead>
                        <tbody>`;

                grouped[sessionName].forEach((item, index) => {
                    let medal = index === 0 ? '🥇 ' : index === 1 ? '🥈 ' : index === 2 ? '🥉 ' : `${index + 1}. `;
                    html += `<tr>
                        <td>${medal}</td>
                        <td><b>${item.competitor}</b></td>
                        <td><b style="color:var(--accent);">${item.time.toFixed(3)}</b></td>
                    </tr>`;
                });

                html += `</tbody></table></div>`;
            }

            container.innerHTML = html;
        }

        function clearLeaderboard() {
            if (confirm("בטוח שאתה רוצה למחוק את כל היסטוריית התוצאות מכל המסלולים?")) {
                localStorage.removeItem('bikeTimerLeaderboard');
                loadLeaderboard();
            }
        }

        window.addEventListener('DOMContentLoaded', loadLeaderboard);
    </script>
</body>
</html>
